<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shot Glücksrad</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #17121f;
            color: white;

            overflow: hidden;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: min(85vw, 380px);
            height: min(85vw, 380px);
        }

        #wheel {
            width: 100%;
            height: 100%;

            border-radius: 50%;
            border: 8px solid white;

            background: conic-gradient(
                #ff4f81 0deg 90deg,
                #6c63ff 90deg 180deg,
                #19c37d 180deg 270deg,
                #ff9f1c 270deg 360deg
            );

            position: relative;

            transition:
                transform 5s cubic-bezier(0.15, 0.8, 0.15, 1);

            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.2);
        }

        .option {
            position: absolute;

            width: 50%;
            height: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: clamp(15px, 4vw, 22px);
            font-weight: bold;

            padding: 15px;
        }

        .option1 {
            top: 0;
            left: 0;
        }

        .option2 {
            top: 0;
            right: 0;
        }

        .option3 {
            bottom: 0;
            right: 0;
        }

        .option4 {
            bottom: 0;
            left: 0;
        }

        .pointer {
            position: absolute;

            top: -28px;
            left: 50%;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 45px solid white;

            z-index: 10;
        }

        button {
            margin-top: 40px;

            padding: 18px 55px;

            border: none;
            border-radius: 18px;

            background: white;
            color: #17121f;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;

            transition: transform 0.15s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.6;
        }

        #result {
            margin-top: 25px;

            min-height: 40px;

            font-size: 28px;
            font-weight: bold;

            text-align: center;
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 34px;
                margin-bottom: 25px;
            }

            button {
                margin-top: 30px;
                padding: 16px 45px;
                font-size: 21px;
            }

            #result {
                font-size: 24px;
            }
        }

    </style>
</head>


<body>

    <h1>Shot Glücksrad</h1>


    <div class="wheel-container">

        <div class="pointer"></div>

        <div id="wheel">

            <div class="option option1">
                Gratis Shot
            </div>

            <div class="option option2">
                Nichts
            </div>

            <div class="option option3">
                Nochmal drehen
            </div>

            <div class="option option4">
                Mach einen Trick
            </div>

        </div>

    </div>


    <button id="spinButton">
        DREHEN
    </button>


    <div id="result"></div>


    <script>

        const wheel =
            document.getElementById("wheel");

        const button =
            document.getElementById("spinButton");

        const result =
            document.getElementById("result");


        let rotation = 0;

        const optionen = [
            "Gratis Shot",
            "Nichts",
            "Nochmal drehen",
            "Mach einen Trick"
        ];


        function drehen() {

            button.disabled = true;

            result.innerHTML = "";


            const zufall =
                Math.floor(
                    Math.random() * optionen.length
                );


            const feldGroesse = 90;


            const ziel =
                360 - (zufall * feldGroesse + feldGroesse / 2);


            const extraRunden =
                5 * 360;


            rotation +=
                extraRunden + ziel;


            wheel.style.transform =
                `rotate(${rotation}deg)`;


            setTimeout(function() {

                result.innerHTML =
                    optionen[zufall];

                button.disabled = false;

            }, 5000);

        }


        button.addEventListener(
            "click",
            drehen
        );

    </script>

</body>

</html>
